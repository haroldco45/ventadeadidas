<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibras Positivas - Ventas</title>
    <style>
        :root {
            --adidas-black: #000000;
            --adidas-white: #ffffff;
            --adidas-grey: #ebeff1;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--adidas-white);
            color: var(--adidas-black);
        }

        header {
            background: var(--adidas-black);
            color: white;
            padding: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
        }

        .container {
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }

        #client-section {
            background: var(--adidas-grey);
            padding: 15px;
            border-radius: 2px;
            margin-bottom: 20px;
            border-left: 5px solid var(--adidas-black);
        }

        .hidden { display: none; }

        label {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 5px 0 15px 0;
            border: 1px solid #000;
            box-sizing: border-box;
        }

        .btn-adidas {
            background: var(--adidas-black);
            color: white;
            padding: 18px;
            width: 100%;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-edit {
            background: #fff;
            border: 1px solid #000;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 5px;
        }

        .product-card {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
            display: flex;
            align-items: center;
        }

        .product-img {
            width: 80px;
            height: 80px;
            background: #f0f0f0;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            text-align: center;
        }

        .product-info { flex-grow: 1; }
        .qty-input {
            width: 50px !important;
            margin: 0 !important;
            text-align: center;
        }

        footer {
            margin-top: 40px;
            font-size: 11px;
            text-align: center;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .order-badge {
            background: #000;
            color: #fff;
            padding: 2px 6px;
            font-size: 12px;
            float: right;
        }
    </style>
</head>
<body>

<header>VIBRAS POSITIVAS</header>

<div class="container">
    
    <div id="client-form-container">
        <div id="client-form" class="hidden">
            <h3 style="text-transform: uppercase; border-bottom: 2px solid #000;">Datos de Envío</h3>
            <label>Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Nombre del cliente">
            <label>Dirección de Entrega</label>
            <input type="text" id="direccion" placeholder="Dirección y Barrio">
            <label>Celular</label>
            <input type="tel" id="telefono" placeholder="Número de contacto">
            <button class="btn-adidas" onclick="saveClientData()">GUARDAR Y CONTINUAR</button>
        </div>

        <div id="client-info" class="hidden">
            <div id="client-section">
                <span class="order-badge" id="next-order-badge">N° 001</span>
                <strong>ENTREGAR A:</strong>
                <div id="display-name" style="text-transform: uppercase;"></div>
                <div id="display-dir" style="font-size: 13px;"></div>
                <button class="btn-edit" onclick="editClientData()">✎ EDITAR DATOS</button>
            </div>
        </div>
    </div>

    <div id="catalog">
        <h3 style="text-transform: uppercase;">Catálogo de Ventas</h3>
        
        <div class="product-card">
            <div class="product-img">ADIDAS<br>FOTO 1</div>
            <div class="product-info">
                <strong>FORUM LOW WHITE</strong>
                <span>$380,000</span>
            </div>
            <input type="number" class="qty-input" id="qty-1" value="0" min="0">
        </div>

        <div class="product-card">
            <div class="product-img">ADIDAS<br>FOTO 2</div>
            <div class="product-info">
                <strong>OZWEEGO BLACK</strong>
                <span>$420,000</span>
            </div>
            <input type="number" class="qty-input" id="qty-2" value="0" min="0">
        </div>

        <button class="btn-adidas" style="margin-top: 25px;" onclick="sendWhatsApp()">ENVIAR PEDIDO</button>
    </div>

    <footer>
        <strong>Harold A. Marín - Emprendedor Independiente</strong><br>
        Carrera 21 B No 13A 64 - Barrio Colinas del Portal<br>
        Caucasia, Antioquia | 3117700431
    </footer>
</div>

<script>
    const products = [
        { id: 1, name: "FORUM LOW WHITE", price: 380000 },
        { id: 2, name: "OZWEEGO BLACK", price: 420000 }
    ];

    window.onload = function() {
        if (!localStorage.getItem('consecutivo_pedido')) {
            localStorage.setItem('consecutivo_pedido', '1');
        }
        updateBadge();

        const savedData = localStorage.getItem('adidas_client');
        if (savedData) {
            showClientInfo(JSON.parse(savedData));
        } else {
            document.getElementById('client-form').classList.remove('hidden');
        }
    };

    function updateBadge() {
        const nro = localStorage.getItem('consecutivo_pedido');
        document.getElementById('next-order-badge').innerText = 'N° ' + nro.padStart(3, '0');
    }

    function saveClientData() {
        const data = {
            nombre: document.getElementById('nombre').value.toUpperCase(),
            direccion: document.getElementById('direccion').value.toUpperCase(),
            telefono: document.getElementById('telefono').value
        };
        if(data.nombre && data.direccion && data.telefono) {
            localStorage.setItem('adidas_client', JSON.stringify(data));
            showClientInfo(data);
        } else {
            alert("Completa todos los datos.");
        }
    }

    function showClientInfo(data) {
        document.getElementById('client-form').classList.add('hidden');
        document.getElementById('client-info').classList.remove('hidden');
        document.getElementById('display-name').innerText = data.nombre;
        document.getElementById('display-dir').innerText = data.direccion + " | " + data.telefono;
    }

    function editClientData() {
        document.getElementById('client-info').classList.add('hidden');
        document.getElementById('client-form').classList.remove('hidden');
    }

    function sendWhatsApp() {
        const client = JSON.parse(localStorage.getItem('adidas_client'));
        let nroPedido = localStorage.getItem('consecutivo_pedido').padStart(3, '0');

        let orderText = `*ORDEN DE PEDIDO N° ${nroPedido}*%0A`;
        orderText += `*VENDEDOR: HAROLD A. MARÍN*%0A`;
        orderText += `------------------------------%0A`;
        orderText += `*CLIENTE:* ${client.nombre}%0A`;
        orderText += `*DIRECCIÓN:* ${client.direccion}%0A`;
        orderText += `*CELULAR:* ${client.telefono}%0A`;
        orderText += `------------------------------%0A`;
        orderText += `*PRODUCTOS:*%0A`;

        let total = 0;
        let hasItems = false;

        products.forEach(p => {
            const qty = document.getElementById(`qty-${p.id}`).value;
            if (qty > 0) {
                const subtotal = qty * p.price;
                // Se agrega el precio unitario ($${p.price.toLocaleString()}) al mensaje
                orderText += `• ${qty}x ${p.name}%0A`;
                orderText += `  (P. Unit: $${p.price.toLocaleString()} | Subtotal: $${subtotal.toLocaleString()})%0A`;
                total += subtotal;
                hasItems = true;
            }
        });

        if(!hasItems) return alert("Selecciona productos.");

        orderText += `------------------------------%0A`;
        orderText += `*TOTAL A PAGAR: $${total.toLocaleString()}*%0A%0A`;
        orderText += `*Generado por: Vibras Positivas*`; // Nuevo cierre personalizado

        localStorage.setItem('consecutivo_pedido', (parseInt(nroPedido) + 1).toString());
        updateBadge();

        window.open(`https://wa.me/573117700431?text=${orderText}`, '_blank');
    }
</script>

</body>
</html>
