<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibras Positivas - Harold & Marleny</title>
    <style>
        :root {
            --adidas-black: #000000;
            --adidas-white: #ffffff;
            --adidas-grey: #ebeff1;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--adidas-white);
            color: var(--adidas-black);
            padding-bottom: 50px;
        }

        header {
            background: var(--adidas-black);
            color: white;
            padding: 30px 10px;
            text-align: center;
        }

        .logo-container img {
            width: 180px;
            height: auto;
            margin-bottom: 15px;
        }

        .brand-name {
            display: block;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 900;
            font-size: 1.4em;
        }

        .container {
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }

        #client-info-display {
            background: var(--adidas-grey);
            padding: 20px;
            border-left: 6px solid var(--adidas-black);
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .hidden { display: none; }

        label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 5px 0 15px 0;
            border: 2px solid #000;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-adidas {
            background: var(--adidas-black);
            color: white;
            padding: 20px;
            width: 100%;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .btn-edit {
            background: #fff;
            border: 1px solid #000;
            padding: 8px 12px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .product-card {
            border-bottom: 1px solid #eee;
            padding: 20px 0;
            display: flex;
            align-items: center;
        }

        .product-img {
            width: 90px;
            height: 90px;
            background: #f4f4f4;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: auto;
        }

        .product-info { flex-grow: 1; }
        .product-info strong { display: block; font-size: 14px; text-transform: uppercase; margin-bottom: 5px; }
        
        .qty-input {
            width: 65px !important;
            margin: 0 !important;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ccc;
        }

        .order-badge {
            background: #000;
            color: #fff;
            padding: 4px 10px;
            font-size: 12px;
            float: right;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            font-size: 12px;
            text-align: center;
            color: #444;
            line-height: 1.6;
            padding: 20px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="hm-adidas.png" alt="Harold & Marleny Logo">
    </div>
    <span class="brand-name">VIBRAS POSITIVAS</span>
</header>

<div class="container">
    
    <div id="client-form" class="hidden">
        <h3 style="text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 10px;">Datos de Envío</h3>
        <label>Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ej: JUAN PEREZ">
        <label>Dirección de Entrega</label>
        <input type="text" id="direccion" placeholder="Ej: CARRERA 21 # 10-50 BARRIO EL CARMEN">
        <label>Celular</label>
        <input type="tel" id="telefono" placeholder="Ej: 3110000000">
        <button class="btn-adidas" onclick="saveClientData()">INGRESAR AL CATÁLOGO</button>
    </div>

    <div id="client-info-display" class="hidden">
        <span class="order-badge" id="nro-pedido-badge">N° 001</span>
        <strong style="font-size: 16px;">ENVIAR A:</strong>
        <div id="display-name" style="text-transform: uppercase; margin-top: 8px; font-weight: 900; font-size: 18px;"></div>
        <div id="display-dir" style="font-size: 14px; margin-top: 5px; color: #333;"></div>
        <button class="btn-edit" onclick="editClientData()">✎ EDITAR DATOS</button>
    </div>

    <div id="catalog">
        <h3 style="text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">PRODUCTOS</h3>
        
        <div class="product-card">
            <div class="product-img">
                <img src="tenis-adistar-control5.JPG" alt="Adistar Control 5">
            </div>
            <div class="product-info">
                <strong>TENIS ADISTAR CONTROL 5</strong>
                <span>$599,950</span>
            </div>
            <input type="number" class="qty-input" id="qty-1" value="0" min="0">
        </div>

        <div class="product-card">
            <div class="product-img">FOTO</div>
            <div class="product-info">
                <strong>FORUM LOW WHITE</strong>
                <span>$380,000</span>
            </div>
            <input type="number" class="qty-input" id="qty-2" value="0" min="0">
        </div>

        <button class="btn-adidas" style="margin-top: 30px;" onclick="sendWhatsApp()">ENVIAR PEDIDO POR WHATSAPP</button>
    </div>

    <footer>
        <strong>Harold A. Marín - Emprendedor Independiente</strong><br>
        Carrera 21 B No 13A 64 - Barrio Colinas del Portal<br>
        Caucasia, Antioquia | 3117700431
    </footer>
</div>

<script>
    const products = [
        { id: 1, name: "TENIS ADISTAR CONTROL 5", price: 599950 },
        { id: 2, name: "FORUM LOW WHITE", price: 380000 }
    ];

    window.onload = function() {
        if (!localStorage.getItem('consecutivo_pedido')) {
            localStorage.setItem('consecutivo_pedido', '1');
        }
        updateBadge();

        const savedData = localStorage.getItem('adidas_client');
        if (savedData) {
            showClientInfo(JSON.parse(savedData));
        } else {
            document.getElementById('client-form').classList.remove('hidden');
        }
    };

    function updateBadge() {
        const nro = localStorage.getItem('consecutivo_pedido');
        document.getElementById('nro-pedido-badge').innerText = 'N° ' + nro.padStart(3, '0');
    }

    function saveClientData() {
        const data = {
            nombre: document.getElementById('nombre').value.toUpperCase(),
            direccion: document.getElementById('direccion').value.toUpperCase(),
            telefono: document.getElementById('telefono').value
        };
        if(data.nombre && data.direccion && data.telefono) {
            localStorage.setItem('adidas_client', JSON.stringify(data));
            showClientInfo(data);
        } else { alert("Por favor completa los campos."); }
    }

    function showClientInfo(data) {
        document.getElementById('client-form').classList.add('hidden');
        document.getElementById('client-info-display').classList.remove('hidden');
        document.getElementById('display-name').innerText = data.nombre;
        document.getElementById('display-dir').innerText = data.direccion + " | TEL: " + data.telefono;
    }

    function editClientData() {
        document.getElementById('client-info-display').classList.add('hidden');
        document.getElementById('client-form').classList.remove('hidden');
    }

    function sendWhatsApp() {
        const client = JSON.parse(localStorage.getItem('adidas_client'));
        let nroPedido = localStorage.getItem('consecutivo_pedido').padStart(3, '0');

        let orderText = `*ORDEN DE PEDIDO N° ${nroPedido}*%0A`;
        orderText += `*VENDEDOR: HAROLD A. MARÍN*%0A`;
        orderText += `------------------------------%0A`;
        orderText += `*CLIENTE:* ${client.nombre}%0A`;
        orderText += `*DIRECCIÓN:* ${client.direccion}%0A`;
        orderText += `*CELULAR:* ${client.telefono}%0A`;
        orderText += `------------------------------%0A`;
        orderText += `*PRODUCTOS:*%0A`;

        let total = 0;
        let hasItems = false;

        products.forEach(p => {
            const qty = document.getElementById(`qty-${p.id}`).value;
            if (qty > 0) {
                const subtotal = qty * p.price;
                orderText += `• ${qty}x ${p.name}%0A`;
                orderText += `  (P. Unit: $${p.price.toLocaleString()} | Sub: $${subtotal.toLocaleString()})%0A`;
                total += subtotal;
                hasItems = true;
            }
        });

        if(!hasItems) return alert("Selecciona productos.");

        orderText += `------------------------------%0A`;
        orderText += `*TOTAL A PAGAR: $${total.toLocaleString()}*%0A%0A`;
        orderText += `*Generado por: Vibras Positivas*`;

        localStorage.setItem('consecutivo_pedido', (parseInt(nroPedido) + 1).toString());
        updateBadge();

        window.open(`https://wa.me/573117700431?text=${orderText}`, '_blank');
    }
</script>

</body>
</html>
